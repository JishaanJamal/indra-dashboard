<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jamal Ahmed — INDRA Terminal</title>
<style>
:root{--bg:#0a0a0f;--panel:#111118;--border:#1f1f2e;--text:#c9d1d9;--dim:#6e7681;--green:#00d4aa;--red:#ff5555;--yellow:#f0ad4e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:monospace;font-size:11px;min-height:100vh;overflow-y:auto}
#header{height:36px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 12px;position:sticky;top:0;z-index:1000}
.logo{color:var(--green);font-weight:bold;font-size:12px}
#sentiment{height:24px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:10px;border-bottom:1px solid var(--border);background:rgba(0,212,170,0.05);color:var(--yellow)}
#dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px;padding:10px;max-width:1400px;margin:0 auto}
.widget{background:var(--panel);border:1px solid var(--border);border-radius:4px;overflow:hidden;min-height:200px;display:flex;flex-direction:column}
.widget-header{height:24px;background:linear-gradient(90deg,var(--panel),#161620);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:10px;color:var(--green);font-weight:bold}
.w-btn{background:none;border:none;color:var(--dim);cursor:pointer;font-family:inherit;font-size:9px;padding:1px 4px}
.w-btn:hover{color:var(--green)}
.widget-body{flex:1;overflow:auto;padding:6px;font-size:10px}
table{width:100%;border-collapse:collapse;font-size:10px}
th{text-align:left;padding:3px 5px;color:var(--dim);border-bottom:1px solid var(--border);font-size:9px;text-transform:uppercase;background:var(--panel)}
td{padding:3px 5px;border-bottom:1px solid rgba(31,31,46,0.5)}
.up{color:var(--green)}.down{color:var(--red)}.muted{color:var(--dim);font-size:9px}
.heat{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.heat-cell{display:flex;flex-direction:column;align-items:center;padding:6px;border-radius:2px;font-size:9px;text-align:center;background:rgba(0,0,0,0.2);border:1px solid var(--border)}
.clocks{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.clock{background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:3px;padding:6px;text-align:center}
.clock-city{font-size:9px;color:var(--green)}.clock-time{font-size:15px;font-weight:bold}
.open{background:rgba(0,212,170,0.15);color:var(--green)}.closed{background:rgba(255,85,85,0.15);color:var(--red)}
.indices{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:3px;padding:4px 8px;min-width:90px}
.pill-name{font-size:9px;color:var(--dim)}.pill-val{font-size:12px;font-weight:bold}.pill-chg{font-size:9px}
.metal{display:flex;align-items:center;justify-content:space-between;padding:5px;background:rgba(0,0,0,0.2);border:1px solid var(--border);border-radius:3px;margin-bottom:4px}
canvas{display:block;width:100%;height:180px}
#menu{position:fixed;top:36px;right:8px;background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:6px;z-index:10001;display:none;min-width:180px;box-shadow:0 8px 30px rgba(0,0,0,0.8)}
#menu.show{display:block}
.mi{padding:5px 8px;cursor:pointer;border-radius:2px;font-size:10px;color:var(--text)}
.mi:hover{background:rgba(0,212,170,0.08);color:var(--green)}
</style>
</head>
<body>

<div id="header">
  <div class="logo">JAMAL AHMED — INDRA TERMINAL</div>
  <div style="display:flex;align-items:center;gap:8px">
    <span id="clk">--:--:--</span>
    <button onclick="tog()" style="background:#0a0a0f;border:1px solid var(--border);color:var(--green);padding:2px 8px;cursor:pointer;font-family:inherit;font-size:10px;border-radius:3px">+</button>
  </div>
</div>

<div id="sentiment">
  <span>NIFTY: <b>22,534.50</b></span>
  <span>BIAS: <b>NEUTRAL</b></span>
  <span>RSI: <b>--</b></span>
</div>

<div id="menu">
  <div class="mi" onclick="add('v')">Indian Top Volume</div>
  <div class="mi" onclick="add('g')">Indian Top Gainers</div>
  <div class="mi" onclick="add('i')">Global Indices</div>
  <div class="mi" onclick="add('h')">Sector Heatmap</div>
  <div class="mi" onclick="add('n')">NIFTY 15-Min Chart</div>
  <div class="mi" onclick="add('a')">AAPL Chart</div>
  <div class="mi" onclick="add('m')">Precious Metals</div>
  <div class="mi" onclick="add('c')">World Clocks</div>
  <div class="mi" onclick="add('t')">Technical Analysis</div>
</div>

<div id="dashboard"></div>

<script>
const S=[{s:'RELIANCE',n:'Reliance',p:2456.3,v:4520000},{s:'TCS',n:'TCS',p:3890.5,v:1230000},{s:'HDFCBANK',n:'HDFC Bank',p:1423.8,v:3890000},{s:'INFY',n:'Infosys',p:1456.2,v:2100000},{s:'ICICIBANK',n:'ICICI Bank',p:945.6,v:5670000},{s:'SBIN',n:'SBI',p:567.4,v:8900000},{s:'BHARTIARTL',n:'Bharti Airtel',p:876.3,v:1780000},{s:'ITC',n:'ITC',p:423.5,v:6540000},{s:'LT',n:'L&T',p:2345.6,v:980000},{s:'KOTAKBANK',n:'Kotak',p:1678.9,v:1450000},{s:'AXISBANK',n:'Axis Bank',p:987.4,v:2340000},{s:'MARUTI',n:'Maruti',p:9876.5,v:560000},{s:'HCLTECH',n:'HCL Tech',p:1234.5,v:890000},{s:'WIPRO',n:'Wipro',p:456.7,v:1230000},{s:'SUNPHARMA',n:'Sun Pharma',p:1123.4,v:780000}];
const I=[{n:'NIFTY 50',v:22534.5,c:0.45},{n:'SENSEX',v:74123.8,c:0.38},{n:'S&P 500',v:5566.2,c:-0.12},{n:'NASDAQ',v:17890.4,c:0.67},{n:'DOW',v:41123.8,c:-0.05},{n:'FTSE',v:8345.3,c:0.23},{n:'DAX',v:18678.9,c:0.15},{n:'NIKKEI',v:38456.7,c:-0.34},{n:'HANG SENG',v:17890.5,c:0.89},{n:'SHANGHAI',v:2956.4,c:-0.21}];
const H=[{n:'AI/ML',sym:'AI',c:2.34},{n:'Solar',sym:'SOL',c:-1.23},{n:'EV',sym:'EV',c:0.87},{n:'Banking',sym:'BNK',c:0.45},{n:'Fintech',sym:'FIN',c:-0.67},{n:'Insurance',sym:'INS',c:0.12},{n:'Oil',sym:'OIL',c:1.45},{n:'Gas',sym:'GAS',c:0.34},{n:'Uranium',sym:'URN',c:3.21},{n:'Wind',sym:'WND',c:-0.89},{n:'Grid',sym:'GRD',c:0.23},{n:'Battery',sym:'BAT',c:-2.11}];
const M=[{n:'Gold',sym:'XAU',p:2345.6,c:0.34},{n:'Silver',sym:'XAG',p:28.45,c:-0.56},{n:'Platinum',sym:'XPT',p:978.3,c:0.12},{n:'Palladium',sym:'XPD',p:1023.4,c:-1.23},{n:'Copper',sym:'COP',p:4.56,c:0.78}];
function r(b,v){return b*(1+(Math.random()-0.5)*v)}
let N=1;
function tog(){document.getElementById('menu').classList.toggle('show')}
document.addEventListener('click',e=>{if(!e.target.closest('#menu')&&!e.target.closest('[onclick="tog()"]'))document.getElementById('menu').classList.remove('show')});
function add(t){
  const id='w'+N++,e=document.createElement('div');e.className='widget';e.id=id;
  const T={v:'INDIAN TOP VOLUME',g:'INDIAN TOP GAINERS',i:'GLOBAL INDICES',h:'SECTOR HEATMAP',a:'AAPL CHART',n:'NIFTY 50 — 15 MIN',m:'PRECIOUS METALS',c:'WORLD SESSIONS',t:'TECHNICAL ANALYSIS'};
  e.innerHTML=`<div class="widget-header"><span>${T[t]||t.toUpperCase()}</span><div><button class="w-btn" onclick="ref('${id}','${t}')">↻</button><button class="w-btn" onclick="document.getElementById('${id}').remove()">×</button></div></div><div class="widget-body" id="b${id}"></div>`;
  document.getElementById('dashboard').appendChild(e);ref(id,t);tog();
}
function ref(id,t){
  const b=document.getElementById('b'+id);if(!b)return;
  if(t==='v'){let d=S.map(s=>({s:s.s,n:s.n,p:r(s.p,0.01),v:Math.floor(s.v*(0.8+Math.random()*0.4)),c:(Math.random()-0.5)*4})).sort((a,b)=>b.v-a.v).slice(0,10);let h='<table><thead><tr><th>Sym</th><th>Price</th><th>Vol</th><th>Chg%</th></tr></thead><tbody>';d.forEach(x=>{let cl=x.c>=0?'up':'down',sg=x.c>=0?'+':'';h+=`<tr><td><b>${x.s}</b><br><span class="muted">${x.n}</span></td><td>₹${x.p.toFixed(2)}</td><td>${(x.v/1e6).toFixed(2)}M</td><td class="${cl}">${sg}${x.c.toFixed(2)}%</td></tr>`});b.innerHTML=h+'</tbody></table>';}
  else if(t==='g'){let d=S.map(s=>({s:s.s,n:s.n,p:r(s.p,0.01),c:(Math.random()-0.3)*5,v:Math.floor(s.v*(0.5+Math.random()))})).sort((a,b)=>b.c-a.c).slice(0,10);let h='<table><thead><tr><th>Sym</th><th>Price</th><th>Chg%</th><th>Vol</th></tr></thead><tbody>';d.forEach(x=>{let cl=x.c>=0?'up':'down',sg=x.c>=0?'+':'';h+=`<tr><td><b>${x.s}</b><br><span class="muted">${x.n}</span></td><td>₹${x.p.toFixed(2)}</td><td class="${cl}">${sg}${x.c.toFixed(2)}%</td><td>${(x.v/1e6).toFixed(2)}M</td></tr>`});b.innerHTML=h+'</tbody></table>';}
  else if(t==='i'){let d=I.map(x=>({n:x.n,v:r(x.v,0.005),c:x.c+(Math.random()-0.5)*0.3}));let h='<div style="display:flex;gap:6px;flex-wrap:wrap">';d.forEach(x=>{let cl=x.c>=0?'up':'down',sg=x.c>=0?'+':'';h+=`<div class="pill"><div class="pill-name">${x.n}</div><div class="pill-val">${x.v.toLocaleString('en-IN',{maximumFractionDigits:2})}</div><div class="pill-chg ${cl}">${sg}${x.c.toFixed(2)}%</div></div>`});b.innerHTML=h+'</div>';}
  else if(t==='h'){let d=H.map(s=>({...s,c:s.c+(Math.random()-0.5)*1.5}));let h='<div class="heat">';d.forEach(x=>{let i=Math.min(Math.abs(x.c)/3,1),bg=x.c>=0?`rgba(0,${Math.floor(212*i)},${Math.floor(170*i)},${0.15+i*0.25})`:`rgba(${Math.floor(255*i)},${Math.floor(85*i)},${Math.floor(85*i)},${0.15+i*0.25})`;h+=`<div class="heat-cell" style="background:${bg};border:1px solid ${x.c>=0?'rgba(0,212,170,0.3)':'rgba(255,85,85,0.3)'}"><b>${x.sym}</b><span class="${x.c>=0?'up':'down'}">${x.c>=0?'+':''}${x.c.toFixed(2)}%</span></div>`});b.innerHTML=h+'</div>';}
  else if(t==='m'){let d=M.map(m=>({...m,p:r(m.p,0.008),c:m.c+(Math.random()-0.5)*0.5}));let h='';d.forEach(x=>{let cl=x.c>=0?'up':'down',sg=x.c>=0?'+':'';h+=`<div class="metal"><div><div class="muted">${x.n} (${x.sym})</div><div style="font-size:14px;font-weight:bold">$${x.p.toFixed(2)}</div><div class="${cl}">${sg}${x.c.toFixed(2)}%</div></div></div>`});b.innerHTML=h;}
  else if(t==='c'){b.innerHTML='<div class="clocks" id="cg'+id+'"></div>';clk(id);}
  else if(t==='a'){b.innerHTML='<canvas id="c'+id+'" width="400" height="180"></canvas>';setTimeout(()=>dr('c'+id,175,20,'AAPL'),50);}
  else if(t==='n'){b.innerHTML='<canvas id="c'+id+'" width="400" height="180"></canvas>';setTimeout(()=>dr('c'+id,22500,200,'NIFTY 50'),50);}
  else if(t==='t'){b.innerHTML='<div style="text-align:center;padding:20px;color:var(--dim)"><b>TECHNICAL ANALYSIS</b><br><br>NIFTY 50 Base: 22,534.50<br><br>Demo mode.<br>Use broker API for live data.</div>';}
}
function clk(id){
  const el=document.getElementById('cg'+id);if(!el)return;
  const mk=[{c:'Tokyo',tz:'Asia/Tokyo',o:9,cl:15},{c:'Mumbai',tz:'Asia/Kolkata',o:9,cl:15.5},{c:'London',tz:'Europe/London',o:8,cl:16.5},{c:'New York',tz:'America/New_York',o:9.5,cl:16}];
  let h='';mk.forEach(x=>{let n=new Date(),ts=n.toLocaleTimeString('en-US',{timeZone:x.tz,hour12:false,hour:'2-digit',minute:'2-digit'}),hr=parseInt(n.toLocaleTimeString('en-US',{timeZone:x.tz,hour12:false,hour:'numeric'})),mn=parseInt(n.toLocaleTimeString('en-US',{timeZone:x.tz,hour12:false,minute:'numeric'})),dt=hr+mn/60,st='closed',txt='CLOSED';if(dt>=x.o&&dt<x.cl){st='open';txt='OPEN'}else if(Math.abs(dt-x.o)<0.5){st='pre';txt='PRE-OPEN'}h+=`<div class="clock"><div class="clock-city">${x.c}</div><div class="clock-time">${ts}</div><div class="clock-status ${st}">${txt}</div></div>`});el.innerHTML=h;
}
function dr(cid,b,s,t){
  const c=document.getElementById(cid);if(!c)return;
  const x=c.getContext('2d'),w=c.width,h=c.height;
  x.fillStyle='#111118';x.fillRect(0,0,w,h);
  x.strokeStyle='rgba(31,31,46,0.6)';x.lineWidth=0.5;
  for(let i=0;i<=4;i++){let y=20+(h-40)/4*i;x.beginPath();x.moveTo(30,y);x.lineTo(w-50,y);x.stroke();x.fillStyle='#6e7681';x.font='8px monospace';x.textAlign='right';x.fillText((b+s-(i*s/4)).toFixed(0),w-5,y+3)}
  let p=b;const bw=5;
  for(let i=0;i<40;i++){let o=p,c=p+(Math.random()-0.48)*s/10,hg=Math.max(o,c)+Math.random()*s/20,l=Math.min(o,c)-Math.random()*s/20,up=c>=o;x.strokeStyle=up?'#00d4aa':'#ff5555';x.fillStyle=up?'#00d4aa':'#ff5555';x.beginPath();x.moveTo(35+i*bw+2,20+(b+s-hg)/s*(h-40));x.lineTo(35+i*bw+2,20+(b+s-l)/s*(h-40));x.stroke();x.fillRect(35+i*bw,20+(b+s-Math.max(o,c))/s*(h-40),4,Math.max(Math.abs((c-o)/s*(h-40)),1));p=c;}
  x.fillStyle='#00d4aa';x.font='bold 10px monospace';x.fillText(t+' — Demo',8,14);x.fillStyle='#6e7681';x.font='8px monospace';x.fillText('Base: '+b,8,24);
}
setInterval(()=>{document.getElementById('clk').textContent=new Date().toLocaleTimeString('en-IN',{hour12:false})},1000);
setInterval(()=>{document.querySelectorAll('[id^="cgw"]').forEach(el=>{const id=el.id.replace('cg','');clk(id)})},1000);
['v','g','i','h','n','a','m','c','t'].forEach(t=>add(t));
</script>
</body>
</html>
